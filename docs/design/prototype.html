<title>LibreTag Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@500;600;700&display=swap">
<style>
:root{
  --font:"Archivo","Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --narrow:"Archivo Narrow","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --page:#E6E4DF; --page-ink:#2A2A2A;
  --bg:#FFFFFF; --surf2:#F6F5F1; --surf3:#ECEAE4; --sheet:#FFFFFF;
  --ink:#1E1E1E; --ink2:#454545; --ink3:#626262; --line:#DEDBD4; --outline:#767676;
  --plate:#1E1E1E; --plate-bg:#FFFFFF; --sel:#EFEDE6;
  --primary:#1E1E1E; --on-primary:#FFFFFF; --tonal:#ECEAE4; --on-tonal:#1E1E1E;
  --inverse:#2E2F31; --on-inverse:#F3F2EE; --inverse-act:#9EC2FF;
  --crit:#C01B24; --on-crit:#FFFFFF; --warn:#F0A030; --on-warn:#1E1E1E; --ok:#2E8A3A; --focus:#1F5FB4;
  --scrim:rgba(18,18,18,.44);
  --e1:0 1px 2px rgba(0,0,0,.22),0 1px 4px rgba(0,0,0,.10);
  --e2:0 2px 4px rgba(0,0,0,.18),0 6px 16px rgba(0,0,0,.14);
  --e3:0 4px 8px rgba(0,0,0,.16),0 12px 32px rgba(0,0,0,.18);
  --map-paper:#F3F0E8; --map-ct:#D7CBA9; --map-ct2:#BFAE82; --map-water:#C3D7E8; --map-river:#8DB0D0;
  --map-road:#FFFFFF; --map-case:#D6CFBE; --map-street:#FBFAF7; --map-forest:#E0E7D0; --map-block:#E7E0D1;
  --chip:#FFFFFF; --blaze-edge:#1E1E1E;
  --b-red:#D7262E; --b-blue:#1F5FB4; --b-green:#2F8F3A; --b-yellow:#F2C200;
  --ease:cubic-bezier(.2,0,0,1); --ease-out:cubic-bezier(.05,.7,.1,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0E0F10; --page-ink:#E7E5E0;
    --bg:#1A1C1E; --surf2:#222528; --surf3:#2C3034; --sheet:#202326;
    --ink:#F1F0EC; --ink2:#CFCDC7; --ink3:#AAA8A2; --line:#363A3F; --outline:#8F8D88;
    --plate:#E6E4DF; --plate-bg:#1F2225; --sel:#2C3034;
    --primary:#F1F0EC; --on-primary:#1A1C1E; --tonal:#30353A; --on-tonal:#F1F0EC;
    --inverse:#E6E4DF; --on-inverse:#1E1E1E; --inverse-act:#1F5FB4;
    --crit:#D2232B; --ok:#55B862; --focus:#8DB8FF;
    --scrim:rgba(0,0,0,.6);
    --map-paper:#1F2225; --map-ct:#3A382F; --map-ct2:#4E4A3B; --map-water:#22364A; --map-river:#3A5C7D;
    --map-road:#41464C; --map-case:#2A2D31; --map-street:#363A3F; --map-forest:#1E2A21; --map-block:#272A2E;
    --chip:#2C3034;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0E0F10; --page-ink:#E7E5E0;
  --bg:#1A1C1E; --surf2:#222528; --surf3:#2C3034; --sheet:#202326;
  --ink:#F1F0EC; --ink2:#CFCDC7; --ink3:#AAA8A2; --line:#363A3F; --outline:#8F8D88;
  --plate:#E6E4DF; --plate-bg:#1F2225; --sel:#2C3034;
  --primary:#F1F0EC; --on-primary:#1A1C1E; --tonal:#30353A; --on-tonal:#F1F0EC;
  --inverse:#E6E4DF; --on-inverse:#1E1E1E; --inverse-act:#1F5FB4;
  --crit:#D2232B; --ok:#55B862; --focus:#8DB8FF;
  --scrim:rgba(0,0,0,.6);
  --map-paper:#1F2225; --map-ct:#3A382F; --map-ct2:#4E4A3B; --map-water:#22364A; --map-river:#3A5C7D;
  --map-road:#41464C; --map-case:#2A2D31; --map-street:#363A3F; --map-forest:#1E2A21; --map-block:#272A2E;
  --chip:#2C3034;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--page-ink);font-family:var(--font);font-variant-numeric:tabular-nums;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
::selection{background:color-mix(in srgb,var(--focus) 32%,transparent);color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
input{caret-color:var(--focus)}
a{color:inherit;text-underline-offset:3px}

/* ---------- prototype toolbar (outside the device) ---------- */
#tb{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;background:color-mix(in srgb,var(--page) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid color-mix(in srgb,var(--page-ink) 12%,transparent);color:var(--page-ink)}
#tb .pt{font:800 15px/20px var(--font);margin-right:4px;white-space:nowrap}
#tb .pt span{font:600 13px var(--narrow);color:color-mix(in srgb,var(--page-ink) 65%,transparent);margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden;flex:none}
.seg button{height:36px;padding:0 14px;border:0;background:transparent;font:600 13px/1 var(--font);color:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--outline)}
.seg button[aria-pressed="true"]{background:var(--tonal);color:var(--on-tonal)}
.seg button[aria-pressed="true"] .i{display:inline-block}
.seg .i{display:none;width:16px;height:16px}
#tb .grow{flex:1}
#tb .seg button[aria-pressed="true"]{background:var(--page-ink);color:var(--page)}
.tbbtn{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--outline);background:transparent;font:600 13px var(--font);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#ctl{position:fixed;z-index:60;top:60px;right:16px;width:min(340px,calc(100vw - 32px));max-height:calc(100dvh - 80px);overflow:auto;background:var(--sheet);color:var(--ink);border-radius:16px;box-shadow:var(--e3);padding:16px;display:none}
#ctl.on{display:block}
#ctl h3{font:800 15px/20px var(--font);margin:0 0 12px}
#ctl .g{margin:0 0 14px}
#ctl .g>span{display:block;font:700 13px/18px var(--narrow);color:var(--ink3);margin-bottom:6px}
#ctl .seg{border-color:var(--outline)}
#ctl .acts{display:flex;flex-wrap:wrap;gap:8px}
#ctl p{font:500 13px/18px var(--narrow);color:var(--ink3);margin:8px 0 0}
#stage{display:flex;justify-content:center;padding:20px 16px 32px}
#wrap{position:relative;flex:none}
#bezel{position:absolute;top:0;left:0;transform-origin:0 0;padding:10px;border-radius:38px;background:#141414;box-shadow:0 30px 60px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.06) inset}
#bezel.tablet{border-radius:30px;padding:14px}
#device{position:relative;overflow:hidden;border-radius:28px;background:var(--bg);color:var(--ink);font-family:var(--font)}
#bezel.tablet #device{border-radius:18px}
#hinge{display:none;position:absolute;left:0;right:0;pointer-events:none;z-index:40}
.tabletop #hinge{display:block}
body.bare #tb .frames{display:none}
body.bare #stage{padding:0}
body.bare #bezel{position:relative;padding:0;border-radius:0;box-shadow:none;background:none;transform:none!important}
body.bare #device{border-radius:0}
body.bare #wrap{width:100%!important;height:auto!important}

/* ---------- app shell ---------- */
#app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.sbar{height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 24px;font:600 13px/1 var(--narrow);color:var(--ink)}
.sbar .r{display:flex;gap:6px;align-items:center}
.sbar .i{width:16px;height:16px}
.scr{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.bar{height:64px;flex:none;display:flex;align-items:center;gap:4px;padding:0 4px 0 16px;background:var(--bg);position:relative;z-index:3}
.bar.nav{padding-left:4px}
.bar h1{margin:0;flex:1;min-width:0;font:800 22px/28px var(--font);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 small{display:block;overflow:hidden;text-overflow:ellipsis;font:600 13px/16px var(--narrow);color:var(--ink3);letter-spacing:0}
.bar .ttl{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.bar .ttl h1{flex:initial}
.bar.raised{box-shadow:0 1px 0 var(--line)}
.ib{width:48px;height:48px;flex:none;border-radius:24px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink);position:relative}
.ib::before,.btn::before,.post::before,.li::before,.chip::before,.pin::before{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;transition:opacity .15s}
.ib:hover::before,.btn:hover::before,.li:hover::before,.chip:hover::before{opacity:.08}
.ib:active::before,.btn:active::before,.li:active::before,.chip:active::before{opacity:.14}
.ib:disabled{opacity:.38;pointer-events:none}
.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.i.f{fill:currentColor;stroke:none}
.i.sm{width:18px;height:18px}
.conn{height:36px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:18px;background:transparent;font:600 14px/1 var(--narrow);color:var(--ink);position:relative;margin-right:2px}
.conn::after{content:"";position:absolute;inset:-6px 0}
.dotc{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.dotc.nostr{background:#7B5BD6}
.dotc.off{background:transparent;border:2px solid var(--ink3)}

/* buttons */
.btn{position:relative;min-height:40px;padding:0 20px;border-radius:20px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14px/20px var(--font);letter-spacing:.01em;text-decoration:none;white-space:nowrap;color:var(--ink);background:transparent}
.btn::after{content:"";position:absolute;left:0;right:0;top:-4px;bottom:-4px}
.btn .i{width:18px;height:18px}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--tonal);color:var(--on-tonal)}
.btn.outlined{border:1px solid var(--outline)}
.btn.text{padding:0 12px}
.btn.critf{background:var(--crit);color:var(--on-crit)}
.btn.crito{border:1px solid var(--crit);color:var(--crit)}
.btn.lg{min-height:52px;border-radius:26px;font-size:15px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.38;pointer-events:none}
.btn.onmapb{background:var(--chip);color:var(--ink);box-shadow:var(--e1);padding:0 16px}
.fab{position:absolute;right:16px;bottom:16px;z-index:5;height:56px;padding:0 20px 0 16px;border-radius:16px;border:0;background:var(--primary);color:var(--on-primary);font:600 15px/1 var(--font);display:inline-flex;align-items:center;gap:10px;box-shadow:var(--e2)}
.fab::before{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0}
.fab:hover::before{opacity:.08}
.chip{position:relative;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--outline);background:var(--bg);display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--font);color:var(--ink);white-space:nowrap}
.chip::after{content:"";position:absolute;left:0;right:0;top:-8px;bottom:-8px}
.chip[aria-pressed="true"]{background:var(--tonal);border-color:transparent}
.chip .i{width:18px;height:18px}
.chip.onmap{background:var(--chip);border-color:transparent;box-shadow:var(--e1)}
.chip.onmap[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}

/* ---------- trail blaze + signpost rows ---------- */
.blz{display:block;flex:none}
.post{position:relative;display:flex;align-items:stretch;width:100%;margin:0 0 8px;padding:0;border:0;background:none;text-align:left;color:var(--ink)}
.post::before{z-index:1;pointer-events:none;border-radius:0}
.post:hover::before{opacity:.05}
.post:active::before{opacity:.1}
.plate{flex:1;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:12px;align-items:start;background:var(--plate-bg);border:2px solid var(--plate);border-right:0;padding:10px 2px 10px 12px}
.tip{position:relative;width:20px;flex:none;margin-left:-1px}
.tip svg{position:absolute;left:0;top:1px;width:100%;height:calc(100% - 2px);overflow:visible}
.tip .tf{fill:var(--plate-bg)}
.tip .ts{fill:none;stroke:var(--plate);stroke-width:2;stroke-linejoin:miter}
.post.sel .plate,.post.sel .tip .tf{background:var(--sel);fill:var(--sel)}
.post.crit .plate{border-color:var(--crit)} .post.crit .ts{stroke:var(--crit)}
.post.warn .plate{border-color:var(--plate)}
.band{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:-10px -2px 10px -12px;padding:6px 12px;font:700 15px/20px var(--narrow)}
.band .i{width:18px;height:18px}
.band.crit{background:var(--crit);color:var(--on-crit)}
.band.warn{background:var(--warn);color:var(--on-warn)}
.mk{padding-top:2px}
.main{display:flex;flex-direction:column;gap:2px;min-width:0}
.nm{font:800 18px/22px var(--font);letter-spacing:-.005em}
.nm .ty{font:600 13px/16px var(--narrow);color:var(--ink3);letter-spacing:0;margin-left:4px}
.ss{font:600 15px/20px var(--narrow);color:var(--ink);display:flex;gap:6px;align-items:flex-start}
.ss .i{width:16px;height:16px;margin-top:2px;color:var(--ink2)}
.pl{font:500 14px/19px var(--narrow);color:var(--ink2)}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding-left:4px;white-space:nowrap}
.age{font:700 16px/22px var(--narrow)}
.bat{display:inline-flex;align-items:center;gap:4px;font:600 13px/16px var(--narrow);color:var(--ink2)}
.bat svg{display:block}
.bat.low{color:var(--ink)}
.slip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:3px 8px;border:1.5px dashed var(--ink2);border-radius:3px;font:600 13px/18px var(--narrow);color:var(--ink);background:var(--bg)}
.slip b{font-weight:700}
.slip .i{width:14px;height:14px}
.slip.s-done{border-style:solid;border-color:var(--ok)}
.slip.s-fail{border-style:solid;border-color:var(--warn)}
.slip.s-sent{border-style:solid}

/* ---------- maps ---------- */
.map{position:absolute;inset:0;overflow:hidden;background:var(--map-paper);touch-action:none;cursor:grab;user-select:none}
.map.dragging{cursor:grabbing}
.map>svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.map .ov{position:absolute;inset:0;pointer-events:none}
.map .ov>*{pointer-events:auto}
.zone{fill:color-mix(in srgb,var(--ink) 5%,transparent);stroke:var(--ink3);stroke-width:1.5;stroke-dasharray:4 4}
.zone.edit{fill:color-mix(in srgb,var(--focus) 12%,transparent);stroke:var(--focus);stroke-width:2;stroke-dasharray:none}
.trk-case{fill:none;stroke:var(--map-paper);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.trk{fill:none;stroke-width:3;stroke-dasharray:9 6;stroke-linecap:round;stroke-linejoin:round}
.pin{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,calc(-100% + 6px));background:none;border:0;padding:0;color:var(--ink);transition:opacity .2s}
.pin::before{display:none}
.pin.pa{transform:translate(-50%,-50%)}
.lab{display:flex;align-items:center;gap:6px;background:var(--chip);color:var(--ink);padding:3px 8px 3px 4px;border-radius:4px;font:700 14px/18px var(--narrow);box-shadow:var(--e1);white-space:nowrap}
.lab i{font-style:normal;font-weight:600;color:var(--ink3)}
.lab .i{width:16px;height:16px}
.pin.crit .lab{box-shadow:0 0 0 2px var(--crit),var(--e1)}
.pin.warn .lab{box-shadow:0 0 0 2px var(--warn),var(--e1)}
.pin.crit .lab .i{color:var(--crit)}
.stem{width:2px;height:var(--stem,8px);background:var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--chip);box-shadow:0 0 0 1px var(--ink)}
.pin.grey .lab{background:var(--surf3);color:var(--ink2);box-shadow:none;border:1px solid var(--outline)}
.pin.grey .dot,.pin.grey .stem{background:var(--ink3)}
.zl{position:absolute;transform:translate(-50%,-50%);font:600 12px/1 var(--narrow);color:var(--ink3);pointer-events:none!important;background:color-mix(in srgb,var(--map-paper) 80%,transparent);padding:2px 4px;border-radius:3px}
.stb{position:absolute;transform:translate(-50%,-50%);min-width:24px;height:20px;padding:0 4px;border-radius:10px;background:var(--chip);border:2px solid var(--c);font:700 11px/16px var(--narrow);color:var(--ink);text-align:center;pointer-events:none!important}
.stb.sm{min-width:8px;width:8px;height:8px;padding:0;border-width:2px}
.rpt{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:6px;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;padding:0}
.rpt .i{width:16px;height:16px}
.rpt::after{content:"";position:absolute;inset:-10px}
.bub{position:absolute;transform:translate(-50%,calc(-100% - 22px));background:var(--inverse);color:var(--on-inverse);padding:6px 10px;border-radius:6px;font:600 13px/18px var(--narrow);white-space:nowrap;box-shadow:var(--e2)}
.zh{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--focus);border:3px solid #fff;box-shadow:var(--e1);touch-action:none;cursor:ew-resize}
.zh::after{content:"";position:absolute;inset:-10px}
.mapctl{position:absolute;display:flex;gap:8px;z-index:2}
.mapnote{position:absolute;left:12px;right:12px;top:12px;background:var(--chip);color:var(--ink);font:600 13px/18px var(--narrow);padding:8px 12px;border-radius:8px;box-shadow:var(--e1);z-index:2}

/* ---------- home ---------- */
.home{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.mapwrap{position:relative;flex:none;height:40%;overflow:hidden;transition:height .28s var(--ease)}
.mapwrap>.map{bottom:auto;height:var(--mh,320px)}
.home.collapsed .mapwrap{height:0}
.home .mapctl{right:12px;bottom:32px}
.sheet{position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-radius:28px 28px 0 0;margin-top:-20px;box-shadow:0 -1px 0 var(--line),0 -4px 14px rgba(0,0,0,.08);transition:border-radius .28s var(--ease),margin .28s var(--ease)}
.home.collapsed .sheet{border-radius:0;margin-top:0;box-shadow:0 -1px 0 var(--line)}
.handle{display:flex;justify-content:center;align-items:center;height:22px;border:0;background:none;width:100%;padding:0;touch-action:none;cursor:ns-resize}
.handle span{width:32px;height:4px;border-radius:2px;background:var(--outline);opacity:.6}
.shead{display:flex;align-items:center;gap:8px;padding:0 8px 6px 16px;min-height:40px}
.shead .t{flex:1;font:700 14px/20px var(--narrow);color:var(--ink2)}
.list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 12px 96px}
.banner{display:flex;gap:10px;align-items:flex-start;margin:0 12px 8px;padding:10px 12px;border-radius:8px;background:var(--surf3);font:600 14px/19px var(--narrow);color:var(--ink)}
.banner .i{width:18px;height:18px;margin-top:1px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 32px 96px;gap:16px}
.empty p{font:500 17px/24px var(--font);margin:0;max-width:28ch;color:var(--ink)}
.empty small{font:500 14px/20px var(--narrow);color:var(--ink3);max-width:34ch}

/* ---------- detail ---------- */
.detail{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.dmap{position:relative;flex:none;height:42%;border-bottom:1px solid var(--line)}
.dmap .mapctl.tl{left:12px;top:12px}
.dmap .mapctl.br,.mpane .mapctl.br,.mp .mapctl.br{right:12px;bottom:12px}
.dbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 40px}
.dbody.enter-l{animation:inL .22s var(--ease-out)}
.dbody.enter-r{animation:inR .22s var(--ease-out)}
@keyframes inL{from{opacity:.2;transform:translateX(-24px)}}
@keyframes inR{from{opacity:.2;transform:translateX(24px)}}
.pager{font:600 13px/1 var(--narrow);color:var(--ink3);white-space:nowrap;padding:0 2px}
.bigpost{margin:0 0 4px}
.bigpost .plate{display:block;padding:12px 4px 12px 14px}

/* ================= map engine ================= */
function mapEl(key,ctl=''){return`<div class="map" data-map="${key}"><svg preserveAspectRatio="none"><use href="#bm"/><g class="geo"></g></svg><div class="ov"></div></div>${ctl}`}
function boundsOf(pts,padU=0){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;pts.forEach(p=>{const r=(p.r||0)+padU;x0=Math.min(x0,p.x-r);y0=Math.min(y0,p.y-r);x1=Math.max(x1,p.x+r);y1=Math.max(y1,p.y+r)});return{x0,y0,x1,y1}}
function scene(key){

  if(key.startsWith('d-')){const t=tagById(key.slice(2));if(!t)return null;const reps=reports(t,dayOf(t)).filter(r=>r.kind!=='ambig');const pts=reps.map(r=>({x:r.x,y:r.y,r:r.kind==='area'&&st.repMap?r.r*1.65:6}));return{b:boundsOf(pts.length?pts:[{x:640,y:700,r:60}],25),draw:(P,k)=>drawDetail(t,P,k)}}
  if(key==='zones'){const t=tagById(st.sheet.id);const z=st.sheet.zones;const r=lastPosRep(t);const pts=[{x:r.x,y:r.y,r:60},...z];return{b:boundsOf(pts,20),draw:(P,k)=>drawZones(z,st.sheet.zsel,P,k,t,r)}}
  if(key==='wz'){const z=st.wiz.zones;const pos={x:646,y:704,kind:'gps'};return{b:boundsOf([{x:646,y:704,r:90},...z],10),draw:(P,k)=>drawZones(z,st.wiz.zsel,P,k,{c:st.wiz.c,s:st.wiz.s,name:st.wiz.name||'New tag'},pos)}}

}
function layoutMap(el){
  const key=el.dataset.map,W=el.offsetWidth,H=el.offsetHeight;if(!W||!H)return;
  const sc=scene(key);if(!sc)return;
  let v=st.view[key];
  if(!v){const padX=44,padT=key.startsWith('d-')?84:key==='all'?64:56,padB=48+(sc.padB||0);const bw=Math.max(sc.b.x1-sc.b.x0,220),bh=Math.max(sc.b.y1-sc.b.y0,220);let k=Math.min((W-2*padX)/bw,(H-padT-padB)/bh);k=Math.max(.12,Math.min(k,1.6));v={cx:(sc.b.x0+sc.b.x1)/2,cy:(sc.b.y0+sc.b.y1)/2+(padB-padT)/2/k,k}}
  const vw=W/v.k,vh=H/v.k,x0=v.cx-vw/2,y0=v.cy-vh/2;
  el.querySelector('svg').setAttribute('viewBox',`${x0} ${y0} ${vw} ${vh}`);
  const P=(x,y)=>[Math.round((x-x0)*v.k),Math.round((y-y0)*v.k)];
  const d=sc.draw(P,v.k);

}
function layoutMaps(){

function relayout(key){$$(`.map[data-map="${key}"]`).forEach(layoutMap)}
function pinHTML(t,[x,y],o={}){

const fade=m=>{const d=NOW-m;return d<60?1:d<180?.8:d<480?.62:.5};
function drawAll(P,k,tags){
  let svg='',html='';
  svg+=`<circle cx="${HOME.x}" cy="${HOME.y}" r="${HOME.r}" class="zone" vector-effect="non-scaling-stroke"/>`;
  const zp=P(HOME.x,HOME.y+HOME.r+6);if(tags.length)html+=`<span class="zl" style="left:${zp[0]}px;top:${zp[1]+6}px">Home</span>`;
  const placed=[],lw=(t,ag)=>t.name.length*7.6+(ag?ag.length*7+6:0)+40;
  const hit=(a)=>placed.some(b=>a[0]<b[0]+b[2]+4&&a[0]+a[2]+4>b[0]&&a[1]<b[1]+b[3]+3&&a[1]+a[3]+3>b[1]);
  const ord=tags.slice().sort((a,b)=>{const ra=lastPosRep(a),rb=lastPosRep(b);return(ra.kind==='area'?0:1)-(rb.kind==='area'?0:1)||(PRIO[a.st]??9)-(PRIO[b.st]??9)});
  const out=[];
  ord.forEach(t=>{
    const r=lastPosRep(t),age=NOW-heard(t),op=fade(heard(t));const ag=age>=90?ageShort(heard(t)):'';const p=P(r.x,r.y);
    if(r.kind==='area'&&st.repMap){svg+=`<circle cx="${r.x}" cy="${r.y}" r="${r.r}" fill="url(#h-${t.c})" stroke="var(--b-${t.c})" stroke-width="2" stroke-dasharray="7 5" vector-effect="non-scaling-stroke" opacity="${op}"/>`;const a='±'+km(r.r)+' km',w=lw(t,a);placed.push([p[0]-w/2,p[1]-13,w,26]);out.push([0,pinHTML(t,p,{area:1,op,age:a,click:1})]);return}
    const w=lw(t,ag);let stem=8;let rect=[p[0]-w/2,p[1]-6-stem-26,w,26];

    placed.push(rect);placed.push([p[0]-7,p[1]-7,14,14]);out.push([PRIO[t.st]!=null?2:1,pinHTML(t,p,{op,age:ag,click:1,stem})]);

const dayOf=t=>st.day[t.id]||0;
function selIdx(t){const n=reports(t,dayOf(t)).length;const v=st.scrub[t.id];return v==null||v>=n?n-1:v}
function selRep(t){return reports(t,dayOf(t))[selIdx(t)]}
function drawDetail(t,P,k){

  (t.zones||[]).forEach(z=>{svg+=`<circle cx="${z.x}" cy="${z.y}" r="${z.r}" class="zone" vector-effect="non-scaling-stroke"/>`;const p=P(z.x,z.y+z.r);html+=`<span class="zl" style="left:${p[0]}px;top:${p[1]+10}px">${esc(z.name)}</span>`});

/* map pointer interaction: pan, pinch, wheel, tap-to-add-zone, radius handle */
let mp=null;
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.map');if(!el||!el._m)return;
  if(e.target.closest('.mapctl,.rpt'))return;
  const zh=e.target.closest('.zh');
  if(!mp||mp.el!==el)mp={el,pts:new Map(),moved:false,zh:zh?+zh.dataset.zh:null};
  mp.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  mp.start={cx:el._m.v.cx,cy:el._m.v.cy,k:el._m.v.k,x:e.clientX,y:e.clientY,d:dist(mp.pts)};
  try{el.setPointerCapture(e.pointerId)}catch(_){}
});
const dist=m=>{const a=[...m.values()];return a.length>1?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0};
document.addEventListener('pointermove',e=>{
  if(!mp||!mp.pts.has(e.pointerId))return;
  mp.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const el=mp.el,key=el.dataset.map,s=mp.start;
  const dx=(e.clientX-s.x)/S,dy=(e.clientY-s.y)/S;
  if(Math.abs(dx)+Math.abs(dy)>5)mp.moved=true;
  if(!mp.moved)return;
  if(mp.zh!=null){const z=zoneList()[mp.zh];if(z){const rect=el.getBoundingClientRect();const wx=el._m.x0+(e.clientX-rect.left)/S/el._m.k;z.r=Math.max(5,Math.min(80,Math.round(Math.abs(wx-z.x))));layoutMap(el);syncZoneUI()}return}
  el.classList.add('dragging');
  let k=s.k;if(mp.pts.size>1&&s.d){k=Math.max(.12,Math.min(4,s.k*dist(mp.pts)/s.d))}
  st.view[key]={cx:s.cx-dx/k,cy:s.cy-dy/k,k};layoutMap(el);
});
function endPtr(e){
  if(!mp||!mp.pts.has(e.pointerId))return;
  mp.pts.delete(e.pointerId);
  const el=mp.el;el.classList.remove('dragging');
  if(!mp.moved&&mp.zh==null&&(el.dataset.map==='zones'||el.dataset.map==='wz')&&!e.target.closest('.zh,.pin')){
    const rect=el.getBoundingClientRect();const wx=el._m.x0+(e.clientX-rect.left)/S/el._m.k,wy=el._m.y0+(e.clientY-rect.top)/S/el._m.k;
    const zl=zoneList();zl.push({name:zl.length?`Zone ${zl.length+1}`:'Home',x:Math.round(wx),y:Math.round(wy),r:15});setZsel(zl.length-1);layoutMap(el);syncZoneUI(true);
  }
  if(mp.moved){const m=mp;setTimeout(()=>{m.suppress=false},0);suppressClick=true;setTimeout(()=>suppressClick=false,30)}
  if(mp.pts.size===0)mp=null;else{mp.start={cx:el._m.v.cx,cy:el._m.v.cy,k:el._m.v.k,x:[...mp.pts.values()][0].x,y:[...mp.pts.values()][0].y,d:dist(mp.pts)}}
}
let suppressClick=false;

  else if(t.st==='tracking')sub=`Heard ${agoLong(heard(t))} · next ~${fmt(nx)}`;

  return`<div class="post bigpost ${s.lvl||''}" role="status"><div class="plate"><p class="bstx">${s.icon?ic(s.icon):''}<span>${esc(s.text)}</span></p><p class="bsub">${esc(sub)}</p></div>${tip()}</div>`;
}
function spRows(t){
  const all=reports(t,dayOf(t)),si=selIdx(t),r=all[si];

  let where='',acts='',lat=null;

  else if(r.kind==='area'){where=st.repMap?`No GPS · area ±${km(r.r)} km (68 %)<small>Centre ${coord(r.x,r.y)} · 95 % within ±${km(r.r*1.65)} km</small>`:`No GPS<small>Download the repeater map to estimate the area.</small>`;lat=st.repMap?r:null}
  else{const pg=all.slice(0,si).filter(x=>x.kind==='gps').pop();where=`No GPS<small>Can't tell which repeater (code shared abroad).${pg?` Last GPS ${pg.t}: ${coord(pg.x,pg.y)}`:''}</small>`;lat=pg||null}

  let when;

  else when=`Report n ${r.n} · ${dayOf(t)?st.daysLbl[dayOf(t)]+' ':''}${r.t}<small>${dayOf(t)?'Earlier day':`${Math.round((lastRep(t).m-r.m)/6)/10} h before the latest report`}</small>`;
  const est=t.est?`<small>${t.est}</small>`:`<small>Battery estimate after 2 weeks of reports</small>`;

}
const CMDS=[['Lost','lost'],['Track 1 h','track'],['Beep','beep'],['Normal','normal']];
function primaryCmd(t){return(t.st==='alarm'||t.st==='silent')?'Lost':t.st==='lost'?'Normal':'Beep'}

function cmdBlock(t){

function timeline(t){
  const d=dayOf(t),items=t.days[d],reps=items.filter(i=>i.k==='r'),si=selIdx(t);
  const chips=st.daysLbl.map((l,i)=>`<button class="chip" data-a="day" data-v="${i}" aria-pressed="${i===d}">${i===d?ic('check'):''}${l}</button>`).join('');

    if(it.k==='q')return`<li><div class="stn q" style="--c:var(--b-${t.c})"><span class="tm">${it.to==='now'?'now':it.to}</span><span class="ln"><span class="sd"></span></span><span class="tx">${esc(it.label)}<small>${it.to==='now'?'since '+it.from:it.from+' to '+it.to} · collapsed</small></span></div></li>`;

function qrPath(){const r=rng(9001);let d='';const fin=(x,y)=>{d+=`M${x} ${y}h7v7h-7ZM${x+1} ${y+1}v5h5v-5ZM${x+2} ${y+2}h3v3h-3Z`};for(let y=0;y<29;y++)for(let x=0;x<29;x++){if((x<8&&y<8)||(x>20&&y<8)||(x<8&&y>20))continue;if(r()<.48)d+=`M${x} ${y}h1v1h-1Z`}fin(0,0);fin(22,0);fin(0,22);return`<path d="${d}" fill="#111" fill-rule="evenodd"/>`}

const timers={};
function sendCmd(t,c){
  clearTimeout(timers[t.id]);clearTimeout(timers[t.id+'b']);clearTimeout(timers[t.id+'c']);
  t.cmd={name:c,ph:'waiting'};t.support=false;
  snack(snackFor(t,c));
  render();
  if(t.st==='silent'||t.st==='quiet'||st.conn==='offline')return; // waits for a real contact
  const nx=nextM(t);
  timers[t.id]=setTimeout(()=>{t.cmd.ph='sent';t.cmd.at=fmt(nx);render();
    timers[t.id+'b']=setTimeout(()=>{
      if(st.deliver==='fail'){t.cmd.ph='failed';render();return}
      t.cmd.ph='confirmed';t.cmd.at=fmt(nx+1);
      if(c==='Lost'){t.st='lost';delete t.alarmText}
      if(c==='Track 1 h'){t.st='tracking';t.until=nx+60}
      if(c==='Normal'){t.st=battOf(t)<20?'lowbatt':'ok'}
      if(!['lost','alarm','silent'].includes(t.st)&&!st.support.never&&st.support.shown<3){t.support=true;st.support.shown++}
      render();
      snack(`${t.name} confirmed ${c}`);
    },3500);
  },3500);
}
function carLeaves(){const car=tagById('car');if(!car||car.st==='alarm'||car.st==='lost')return;car.st='alarm';car.alarmText='Left Home 14:02';const d=car.days[0];d.pop();d.push(G('14:02',1191,672,662,6,97,'Left Home'));car.interval=60;delete st.view['all'];delete st.view['d-car']}

let dragging=false,pending=false;
function render(){
  if(dragging){pending=true;return}
  const keep={};$$('[data-sk]').forEach(e=>keep[e.dataset.sk]=e.scrollTop);
  const r=st.route;let html=sbar();
  const sel=r.startsWith('tag-')?r.slice(4):null;
  if(sel&&!tagById(sel)){st.route='home';return render()}
  if(r==='add')html+=wizard();
  else if(['prefs','connections','repeaters','nostr-key','about'].includes(r))html+=subScreen(r);
  else if(st.frame==='phone')html+=sel?detailScreen(sel):homeScreen();
  else if(st.frame==='fold')html+=`<div class="lay-m">${listPane(sel)}${sel?detailPane(sel):allMapPane()}</div>`;
  else if(st.frame==='tabletop')html+=tabletop(sel);
  else html+=`<div class="lay-x">${listPane(sel)}${tabletMap(sel)}${sidePanel(sel)}</div>`;
  $('#app').innerHTML=html;
  $$('[data-sk]').forEach(e=>{if(keep[e.dataset.sk]!=null)e.scrollTop=keep[e.dataset.sk]});
  st.dir=null;
  layoutMaps();
  bindLists();
  syncToolbar();
}
function bindLists(){
  const home=$('.home');if(!home)return;
  const list=home.querySelector('.list');if(!list)return;
  list.addEventListener('scroll',()=>{if(list.scrollTop>12&&!st.mapCollapsed)setCollapsed(true)},{passive:true});
  list.addEventListener('wheel',e=>{if(list.scrollTop<=0&&e.deltaY<-8&&st.mapCollapsed)setCollapsed(false)},{passive:true});
  let ty=null;
  list.addEventListener('touchstart',e=>{ty=list.scrollTop<=0?e.touches[0].clientY:null},{passive:true});
  list.addEventListener('touchmove',e=>{if(ty!=null&&e.touches[0].clientY-ty>50&&st.mapCollapsed){setCollapsed(false);ty=null}},{passive:true});
  const h=home.querySelector('.handle');let hy=null;
  h.addEventListener('pointerdown',e=>{hy=e.clientY});
  h.addEventListener('pointerup',e=>{if(hy==null)return;const dy=e.clientY-hy;hy=null;if(Math.abs(dy)>16){suppressClick=true;setTimeout(()=>suppressClick=false,30);setCollapsed(dy<0)}});
}
function setCollapsed(v){
  st.mapCollapsed=v;const home=$('.home');if(!home){render();return}
  home.classList.toggle('collapsed',v);
  const head=home.querySelector('.shead');
  const b=head.querySelector('.btn');if(b)b.remove();
  if(v)head.insertAdjacentHTML('beforeend',`<button class="btn text" data-a="hidemap">${ic('down')}Show map</button>`);
  home.querySelector('.handle').setAttribute('aria-label',v?'Show map':'Hide map');
}
function updateScrub(id){
  const t=tagById(id);
  $$(`[data-sp="${id}"]`).forEach(e=>e.innerHTML=spRows(t));
  const reps=reports(t,dayOf(t)),si=selIdx(t);
  $$(`[data-stns="${id}"] .stn:not(.q)`).forEach(b=>{const on=+b.dataset.v===si;b.classList.toggle('on',on);b.setAttribute('aria-current',on)});
  $$(`[data-scrub="${id}"]`).forEach(r=>{r.value=si;r.style.setProperty('--p',(reps.length>1?si/(reps.length-1)*100:100)+'%');const l=r.closest('.scrub').querySelector('[data-lbl]');if(l)l.textContent=`Report ${si+1} of ${reps.length} · ${reps[si].t}`});
  relayout('d-'+id);
}

/* ================= actions ================= */
function go(r){st.menu=null;if(location.hash.slice(1)===r){st.route=r;render();ovr();}else location.hash=r}
const A={
  go:v=>{if(v==='add'){st.wiz=newWiz();setTimeout(()=>{if(st.wiz&&st.wiz.step===0&&st.wiz.phase==='wait'){st.wiz.phase='found';render()}},1600)}st.sheet=null;st.dialog=null;go(v)},
  open:v=>{if(st.route==='tag-'+v&&st.frame!=='phone')return;st.bubble=null;go('tag-'+v)},
  back:()=>{const r=st.route;go('home');if(r.startsWith('tag-')&&st.frame==='phone'){}},
  step:v=>{const tags=visibleTags(),i=tags.findIndex(x=>'tag-'+x.id===st.route),n=tags[i+ +v];if(n){st.dir=+v;st.bubble=null;go('tag-'+n.id)}},
  menu:(v,el)=>{st.menu=v;const dr=$('#device').getBoundingClientRect(),r=el.getBoundingClientRect();st.menuPos={top:Math.round((r.bottom-dr.top)/S)+4,right:Math.max(8,Math.round((dr.right-r.right)/S))};ovr()},
  closeov:()=>{st.menu=null;st.sheet=null;st.dialog=null;ovr()},
  sheet:v=>{const t=curTag();st.menu=null;
    const base={type:v,id:t&&t.id};
    if(v==='zones'){base.zones=clone(t.zones||[]);base.zsel=base.zones.length?0:-1;delete st.view.zones}
    if(v==='known')base.picked={0:true,2:t&&t.type==='vehicle'};
    if(v==='alerts')base.alerts={silent:true,batt:true,zone:!!(t&&t.zones&&t.zones.length),guard:false};
    if(v==='share')Object.assign(base,{level:'view',method:'qr'});
    if(v==='edit')Object.assign(base,{name:t.name,ty:t.type,c:t.c,s:t.s});
    if(v==='remove'){st.dialog={type:'remove',id:t.id};st.sheet=null;ovr();return}
    st.sheet=base;ovr()},
  fit:v=>{delete st.view[v];relayout(v)},
  hidemap:()=>setCollapsed(!st.mapCollapsed),
  reps:()=>{st.reps=!st.reps;st.bubble=null;render()},
  bubble:v=>{st.bubble=st.bubble===v?null:v;const t=curTag();if(t)relayout('d-'+t.id)},
  cmd:v=>{const t=curTag();if(!t||t.shared)return;if(v==='Lost'){st.dialog={type:'lost',id:t.id};ovr();return}sendCmd(t,v)},
  lostok:()=>{const t=tagById(st.dialog.id);st.dialog=null;ovr();sendCmd(t,'Lost')},
  day:v=>{const t=curTag();st.day[t.id]=+v;delete st.scrub[t.id];delete st.view['d-'+t.id];render()},
  scrub:v=>{const t=curTag();st.scrub[t.id]=+v;updateScrub(t.id)},
  latest:v=>{st.day[v]=0;delete st.scrub[v];render()},
  copy:v=>{copyText(v);snack(v.startsWith('npub')?'Key copied':'Coordinates copied')},
  openmap:(v,el)=>{st.sheet={type:'openmap',id:v,n:el.dataset.n};ovr()},
  openapp:v=>{st.sheet=null;ovr();snack(`Opening in ${v}`)},
  removeok:()=>{const t=tagById(st.dialog.id);const idx=st.tags.indexOf(t);st.tags.splice(idx,1);st.dialog=null;st.removed={t,idx};ovr();go('home');snack(`${t.name} removed`,'undo','Undo')},
  undo:()=>{if(st.removed){st.tags.splice(st.removed.idx,0,st.removed.t);st.removed=null;st.snack=null;render();renderSnack()}},
  saveclose:v=>{st.sheet=null;ovr();snack(v)},
  snack:v=>snack(v),
  zsel:v=>{setZsel(+v);syncZoneUI(true);relayout(st.sheet&&st.sheet.type==='zones'?'zones':'wz')},
  zdel:v=>{const zl=zoneList();zl.splice(+v,1);setZsel(zl.length?0:-1);syncZoneUI(true);relayout(st.sheet&&st.sheet.type==='zones'?'zones':'wz')},
  zsave:()=>{const t=tagById(st.sheet.id);t.zones=st.sheet.zones;st.sheet=null;ovr();render();snack(`Zones saved. ${t.name} gets them with the next report.`)},
  kpick:v=>{st.sheet.picked[v]=!st.sheet.picked[v];ovr()},
  salert:v=>{st.sheet.alerts[v]=!st.sheet.alerts[v];ovr()},
  guard:()=>{st.sheet.alerts.guard=true;ovr();snack('Guarding this spot. You get an alert if the tag moves.')},
  slevel:v=>{st.sheet.level=v;ovr()},
  smethod:v=>{st.sheet.method=v;ovr()},
  unshare:()=>{snack("Stopped sharing with Marta. She keeps what she's already seen.")},
  etype:v=>{st.sheet.ty=v;ovr()},
  emark:v=>{const[c,s]=v.split('|');st.sheet.c=c;st.sheet.s=s;ovr()},
  esave:()=>{const t=tagById(st.sheet.id),s=st.sheet;t.name=(s.name||t.name).trim()||t.name;t.type=s.ty;t.c=s.c;t.s=s.s;st.sheet=null;ovr();render();snack('Saved')},
  lang:v=>{st.sheet=null;ovr();if(v!=='English')snack('Translations come later. This prototype is English only.')},
  units:v=>{st.units=v;render();if(v==='imperial')snack('Imperial units are planned. The prototype shows metric.')},
  theme:v=>setTheme(v),
  notif:v=>{st.notif[v]=!st.notif[v];render()},
  shade:()=>{st.sheet=null;st.menu=null;st.shade=true;ovr()},
  shadeclose:()=>{st.shade=false;ovr()},
  'notif-open':v=>{st.shade=false;if(v==='car')carLeaves();ovr();st.dir=null;go('tag-'+v)},
  repupdate:()=>{st.repBusy=true;render();setTimeout(()=>{st.repBusy=false;st.repMap=true;st.repAge=0;st.repCount=55412;render();snack('Repeater map updated · 55,412 repeaters');ctlRender()},2200)},
  backup:()=>{const pp=($('#pp')||{}).value||'';if(pp.trim().split(/\s+/).length<4){snack('Use at least 4 words for the passphrase.');return}st.backup=true;render();snack('Key backed up to Nostr')},
  backupoff:()=>{st.backup=false;render();snack('Backup deleted from the relays that answered')},
  supnot:v=>{const t=curTag();if(v==='paired'&&st.wiz)st.wiz.support=false;else if(t)t.support=false;render()},
  supnever:()=>{st.support.never=true;render();snack("Got it. The menu still has Support the project.")},
  supportgo:()=>{},
  // wizard
  wdetect:v=>{const w=st.wiz;w.detect=v;w.phase='found';render()},
  wunlock:()=>{const w=st.wiz;w.phase='unlocking';render();setTimeout(()=>{w.phase=w.detect==='fail'?'failed':'unlocked';render()},1200)},
  wreset:()=>{st.dialog={type:'reset'};ovr()},
  wresetok:()=>{st.dialog=null;ovr();st.wiz.phase='reset';render()},
  wstep:v=>{const w=st.wiz;w.step=Math.max(0,Math.min(5,w.step+ +v));if(w.step===3&&w.scan===0)startScan();if(w.step===2)delete st.view.wz;render();const b=$('.wb');if(b)b.scrollTop=0},
  wtype:v=>{st.wiz.type=v;render()},
  wmark:v=>{const[c,s]=v.split('|');st.wiz.c=c;st.wiz.s=s;render()},
  wpick:v=>{st.wiz.picked[v]=!st.wiz.picked[v];render()},
  wscan:()=>{st.wiz.scan=0;startScan();render()},
  walert:v=>{st.wiz.alerts[v]=!st.wiz.alerts[v];render()},
  wnobackup:()=>{st.backup=st.backup;const c=$('.wb .card');if(c)c.remove()},
  wclose:()=>{if(st.wiz&&st.wiz.step>0&&st.wiz.step<5){st.dialog={type:'wclose'};ovr();return}st.wiz=null;go('home')},
  wcloseok:()=>{st.dialog=null;ovr();st.wiz=null;go('home')},
  wfinish:()=>{const w=st.wiz;if(w.support&&!st.support.never&&st.support.shown<3)st.support.shown++;const id='t'+Date.now().toString(36);const z=w.zones;
    st.tags.push({id,name:w.name.trim()||'New tag',type:w.type,c:w.c,s:w.s,st:'ok',interval:60,route:'via mesh, 0 hops',hop:'Water tower',est:null,fw:'0.5.2',snr:5,rssi:-90,zones:z,days:[[G(fmt(NOW),1,646,704,7,76,'Paired')],[],[]]});
    st.tags[st.tags.length-1].days[1]=[G('12:00',0,646,704,9,76,'Factory test')];st.tags[st.tags.length-1].days[2]=[G('12:00',0,646,704,9,76,'Factory test')];
    if(st.count===0)st.count=6;st.wiz=null;go('tag-'+id);snack('Tag paired')}
};
let scanT;function startScan(){clearInterval(scanT);scanT=setInterval(()=>{const w=st.wiz;if(!w||w.step!==3){clearInterval(scanT);return}w.scan++;if(w.scan>=30){w.scan=30;clearInterval(scanT)}const lbl=$('[data-scanlbl]');if(DEVS.some(d=>d.at===w.scan)||w.scan===30||!lbl)render();else{lbl.textContent=`Scanning · ${30-w.scan} s left`;const p=$('.wb .prog i');if(p)p.style.width=w.scan/30*100+'%'}},1000)}
function copyText(v){try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(v).catch(()=>fallbackCopy(v));return}}catch(_){}fallbackCopy(v)}
function fallbackCopy(v){const ta=document.createElement('textarea');ta.value=v;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove()}

document.addEventListener('click',e=>{
  if(suppressClick){const inMap=e.target.closest('.map,.handle');if(inMap){e.preventDefault();e.stopPropagation();return}}
  const el=e.target.closest('[data-a]');if(!el)return;
  if(!el.closest('#device'))return;
  const a=el.dataset.a;if(!A[a])return;
  if(el.tagName==='A'&&a!=='closeov'&&a!=='supportgo')e.preventDefault();
  if(a==='closeov'&&el.tagName==='A'){setTimeout(()=>A.closeov(),0);return}
  A[a](el.dataset.v,el,e);
},true);
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.scrub){const id=t.dataset.scrub;st.scrub[id]=+t.value;updateScrub(id);return}
  if(t.dataset.zr!=null){const z=zoneList()[+t.dataset.zr];if(z){z.r=+t.value;t.style.setProperty('--p',(z.r-5)/75*100+'%');syncZoneUI();relayout(st.sheet&&st.sheet.type==='zones'?'zones':'wz')}return}
  if(t.dataset.in==='wname'){st.wiz.name=t.value;const n=$('.wf .btn.filled');if(n)n.disabled=!t.value.trim();return}
  if(t.dataset.in==='ename'){st.sheet.name=t.value;return}
});
document.addEventListener('pointerdown',e=>{if(e.target.matches('input[type=range]'))dragging=true});
document.addEventListener('pointerup',()=>{if(dragging){dragging=false;if(pending){pending=false;render()}}});
/* swipe between tags */
let sw=null;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-swipe]');if(!b||e.target.closest('input,.days,button'))return;sw={x:e.clientX,y:e.clientY}},true);
document.addEventListener('pointerup',e=>{if(!sw)return;const dx=(e.clientX-sw.x)/S,dy=(e.clientY-sw.y)/S;sw=null;if(Math.abs(dx)>70&&Math.abs(dy)<45)A.step(dx<0?1:-1)},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(st.shade){st.shade=false;ovr()}else if(st.menu||st.sheet||st.dialog)A.closeov();else if($('#ctl').classList.contains('on'))toggleCtl(false);else if(st.route!=='home')A.back()}
  if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&st.route.startsWith('tag-')&&!e.target.matches('input')&&!st.sheet&&!st.dialog)A.step(e.key==='ArrowLeft'?-1:1);
});
window.addEventListener('hashchange',()=>{st.route=location.hash.slice(1)||'home';if(st.route==='add'&&!st.wiz)st.wiz=newWiz();st.menu=null;render();ovr()});

/* ================= prototype chrome ================= */
function setTheme(v){st.theme=v;if(v==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v);render();ovr()}
function syncToolbar(){$$('#tb [data-f]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===st.frame));$$('#tb [data-t]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===st.theme))}
$$('#tb [data-f]').forEach(b=>b.addEventListener('click',()=>{st.frame=b.dataset.f;st.view={};fit();render();ovr()}));
$$('#tb [data-t]').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.t)));
function toggleCtl(on){const c=$('#ctl');c.classList.toggle('on',on);$('#ctlbtn').setAttribute('aria-expanded',on);if(on)ctlRender()}
$('#ctlbtn').addEventListener('click',()=>toggleCtl(!$('#ctl').classList.contains('on')));
function ctlRender(){
  const seg=(k,vals)=>`<div class="seg" role="group">${vals.map(([v,l])=>`<button data-c="${k}" data-cv="${v}" aria-pressed="${String(st[k])===String(v)}">${l}</button>`).join('')}</div>`;
  $('#ctl').innerHTML=`<h3>Scenarios</h3>${bare?`<div class="g"><span>Theme</span>${seg('theme',[['system','Auto'],['light','Light'],['dark','Dark']])}</div>`:''}<div class="g"><span>Connection</span>${seg('conn',[['mesh','mesh'],['nostr','Nostr only'],['offline','offline']])}</div><div class="g"><span>Number of tags</span>${seg('count',[[6,'6'],[1,'1'],[0,'0 (empty)']])}</div><div class="g"><span>Repeater map</span>${seg('repMap',[[true,'Downloaded'],[false,'Missing']])}</div><div class="g"><span>Command delivery</span>${seg('deliver',[['ok','Confirmed'],['fail','Not confirmed']])}</div><div class="g"><span>Events</span><div class="acts"><button class="tbbtn" data-c="shade">Notifications</button><button class="tbbtn" data-c="usb">Plug in Car (USB)</button><button class="tbbtn" data-c="carleave">Car leaves Home</button><button class="tbbtn" data-c="reset">Reset demo</button></div></div><p>Command delivery runs in a few seconds here. The real app waits for the tag's next report.</p>`;
}
$('#ctl').addEventListener('click',e=>{
  const b=e.target.closest('[data-c]');if(!b)return;const k=b.dataset.c,v=b.dataset.cv;
  if(k==='theme'){setTheme(v);ctlRender();return}
  if(k==='conn')st.conn=v;
  if(k==='count'){st.count=+v;st.view={}}
  if(k==='repMap'){st.repMap=v==='true';st.view={}}
  if(k==='deliver')st.deliver=v;
  if(k==='shade'){st.shade=true;toggleCtl(false);ovr();return}
  if(k==='usb'){toggleCtl(false);st.menu=null;st.dialog=null;st.sheet={type:'service',id:'car'};ovr();return}
  if(k==='carleave'){carLeaves();toggleCtl(false);render();snack('Car left Home at 14:02');return}
  if(k==='reset'){Object.values(timers).forEach(clearTimeout);Object.assign(st,{tags:mkTags(),count:6,conn:'mesh',repMap:true,deliver:'ok',mapCollapsed:false,day:{},scrub:{},view:{},menu:null,sheet:null,dialog:null,wiz:null,reps:false,support:{shown:0,never:false},backup:false,repAge:12,repCount:55386,shade:false});toggleCtl(false);go('home');ovr();return}
  ctlRender();render();
});
document.addEventListener('click',e=>{const c=$('#ctl');if(c.classList.contains('on')&&!e.target.closest('#ctl,#ctlbtn'))toggleCtl(false)});

const FR={phone:[390,844],fold:[720,840],tabletop:[720,840],tablet:[1280,800]};
function fit(){
  bare=window.innerWidth<500;
  document.body.classList.toggle('bare',bare);
  const bz=$('#bezel'),dv=$('#device'),wr=$('#wrap');
  if(bare){if(st.frame!=='phone')st.frame='phone';S=1;const tb=$('#tb').offsetHeight;dv.style.width='100%';dv.style.height=(window.innerHeight-tb)+'px';bz.className='';return}
  const[W,H]=FR[st.frame];const bp=st.frame==='tablet'?14:10;
  dv.style.width=W+'px';dv.style.height=H+'px';
  bz.className=(st.frame==='tablet'?'tablet ':'')+(st.frame==='tabletop'?'tabletop':'');
  const tb=$('#tb').offsetHeight;
  const aw=Math.min(window.innerWidth,document.documentElement.clientWidth)-32,ah=window.innerHeight-tb-44;
  const fw=W+bp*2,fh=H+bp*2;
  S=Math.min(1,aw/fw,Math.max(ah/fh,Math.min(.7,aw/fw)));
  bz.style.transform=`scale(${S})`;wr.style.width=fw*S+'px';wr.style.height=fh*S+'px';
  const hg=$('#hinge');if(st.frame==='tabletop'){hg.style.top=(H/2-6)+'px';hg.style.height='12px'}
}
let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{const wasBare=bare;fit();render();if(wasBare!==bare)ctlRender()},120)});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(st.theme==='system')render()});

/* ================= boot ================= */
st.daysLbl=['Today','Sun 15 Nov','Sat 14 Nov'];
buildDefs();
st.route=location.hash.slice(1)||'home';
if(st.route==='add')st.wiz=newWiz(),setTimeout(()=>{if(st.wiz){st.wiz.phase='found';render()}},1600);
fit();render();ovr();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{fit();layoutMaps()});
})();
</script>
